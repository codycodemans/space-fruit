<!DOCTYPE html>

	<head>

		<title>Space Fruit</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Space Fruit">

<style>
html, body { background-color: #000; }
#turn { display: none; position: fixed; inset: 0; z-index: 1000; background: #05060d; color: #fff;
	font: 18px sans-serif; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
#turn p { margin: 0; }
#turn .zh { color: #aab; font-size: 16px; }
#turn .phone { width: 34px; height: 58px; border: 3px solid #ffcc59; border-radius: 6px; margin-bottom: 14px;
	animation: turn-phone 2s ease-in-out infinite; }
@keyframes turn-phone { 0%, 25% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (pointer: coarse) { #turn { display: flex; } }
</style>
<script>
(function () {
	// The game is laid out for landscape. While a phone is held upright a
	// screen asks to turn it, which also keeps taps off the squashed game.
	document.addEventListener("DOMContentLoaded", function () {
		var turn = document.createElement("div");
		turn.id = "turn";
		turn.innerHTML = '<div class="phone"></div><p>Turn your phone sideways to play</p><p class="zh">请将手机横过来</p>';
		document.body.appendChild(turn);
	});
	// After a turn the browser can leave the page scrolled for a moment, and
	// taps miss; scroll it back a few times while it settles.
	function settle() {
		window.scrollTo(0, 0);
	}
	function turned() {
		[100, 400, 1000].forEach(function (ms) { setTimeout(settle, ms); });
	}
	window.addEventListener("orientationchange", turned);
	if (window.matchMedia) {
		var portrait = window.matchMedia("(orientation: portrait)");
		if (portrait.addEventListener) { portrait.addEventListener("change", turned); }
	}
	// Where the browser allows it (Android, full screen or installed), stay sideways.
	window.addEventListener("touchend", function () {
		if (screen.orientation && screen.orientation.lock) {
			screen.orientation.lock("landscape").catch(function () {});
		}
	}, { once: true });
	// iPhones mute web sound with the ring/silent switch unless the page says
	// it plays media, as a music app does.
	try {
		if (navigator.audioSession) { navigator.audioSession.type = 'playback'; }
	} catch (e) {}
	// Phones keep a page's sound paused until it is woken during a tap, and
	// pause it again after switching apps. Keep every sound context the game
	// makes and wake them all on each tap, with a silent blip the first time.
	var contexts = [];
	var Base = window.AudioContext || window.webkitAudioContext;
	if (Base) {
		var Kept = function (options) {
			var context = options === undefined ? new Base() : new Base(options);
			contexts.push(context);
			return context;
		};
		Kept.prototype = Base.prototype;
		window.AudioContext = Kept;
		if (window.webkitAudioContext) { window.webkitAudioContext = Kept; }
	}
	function wake() {
		contexts.forEach(function (context) {
			if (context.state !== 'running' && context.state !== 'closed') {
				context.resume().catch(function () {});
			}
			if (!context.spaceFruitWoken) {
				context.spaceFruitWoken = true;
				try {
					var blip = context.createBufferSource();
					blip.buffer = context.createBuffer(1, 1, 22050);
					blip.connect(context.destination);
					blip.start(0);
				} catch (e) {}
			}
		});
	}
	['touchstart', 'touchend', 'pointerdown', 'pointerup', 'click', 'keydown'].forEach(function (type) {
		window.addEventListener(type, wake, true);
	});
	document.addEventListener('visibilitychange', function () {
		if (!document.hidden) { wake(); }
	});
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":12501068,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
